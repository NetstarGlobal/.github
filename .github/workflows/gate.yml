# The shared quality gate. A repo calls this instead of copying it:
#
#   name: gate
#   on: { pull_request: {}, push: { branches: [main] } }
#   jobs:
#     gate:
#       uses: NetstarGlobal/.github/.github/workflows/gate.yml@main
#       secrets: inherit
#
# A Go repo needs nothing more. A Node repo passes `with: { go: false, node-version: "22" }`.
# It runs the repo's own hack/gate.sh — the same command a developer runs before
# committing — then a full-history secret scan. Every action is pinned by commit SHA,
# the token is read-only, and the trigger is pull_request (never pull_request_target).
name: gate
on:
  workflow_call:
    inputs:
      go:
        description: Set up a Go toolchain from go.mod before running the gate
        type: boolean
        default: true
      node-version:
        description: Set up this Node.js major (for example "22") before running the gate; empty skips it. A Node repo passes this and go:false.
        type: string
        default: ""
    secrets:
      MODULES_TOKEN:
        description: Optional token with read on private Go modules this repo imports
        required: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOPRIVATE: github.com/NetstarGlobal,github.com/netstar-labs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        if: ${{ inputs.go }}
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ inputs.node-version != '' }}
        with:
          node-version: ${{ inputs.node-version }}
      - name: private modules
        if: ${{ inputs.go && env.MODULES_TOKEN != '' }}
        env:
          MODULES_TOKEN: ${{ secrets.MODULES_TOKEN }}
        run: git config --global url."https://x-access-token:${MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: gate
        run: |
          test -x hack/gate.sh || { echo "::error::hack/gate.sh is missing or not executable — every system repo carries the gate script (handbook repos.md §3a)"; exit 1; }
          hack/gate.sh
      - name: secrets
        # Full-history scan. A secret deleted in a later commit is still in the history,
        # so the working tree is the wrong thing to scan (handbook security.md §1).
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
