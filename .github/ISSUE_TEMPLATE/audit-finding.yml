name: Audit finding
description: A finding from an audit pass (handbook audits.md)
labels: ["type:audit"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [critical, high, medium, low, informational]
    validations: { required: true }
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      description: Confirmed by an independent route, or plausible with what would settle it stated below.
      options: [confirmed, plausible]
    validations: { required: true }
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What is wrong, at file:line, and the failure scenario — concrete input or state, then the wrong output.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The command, test, or query that produced the observation, with its output.
    validations: { required: true }
  - type: input
    id: ledger
    attributes:
      label: Audit file
      description: The docs/audits/ file this finding is recorded in.
